[package]
name = "tlsn-attestation"
version = "0.1.0-alpha.13"
edition = "2024"

[features]
default = ["private-facets", "public-facets"]
fixtures = ["tlsn-core/fixtures", "dep:tlsn-data-fixtures"]
private-facets = ["tlsn-core/private-facets"]
public-facets = ["tlsn-core/public-facets", "dep:tlsn-tls-core"]

[dependencies]
tlsn-tls-core = { workspace = true, optional = true }
tlsn-core = { workspace = true, default-features = false}
tlsn-data-fixtures = { workspace = true, optional = true }

bcs = { workspace = true }
blake3 = { workspace = true }
p256 = { workspace = true, features = ["serde"] }
k256 = { workspace = true }
opaque-debug = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tiny-keccak = { workspace = true, features = ["keccak"] }

[dev-dependencies]
alloy-primitives = { version = "1.3.1", default-features = false }
alloy-signer = { version = "1.0", default-features = false }
alloy-signer-local = { version = "1.0", default-features = false }
rand06-compat = { workspace = true }
rstest = { workspace = true }
tlsn-core = { workspace = true, features = ["fixtures"] }
tlsn-data-fixtures = { workspace = true }

[lints]
workspace = true

[[test]]
name = "api"
required-features = ["fixtures"]
